<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <!-- Empty icon so the browser does not request a missing favicon.ico -->
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Expense Tracker</h1>

    <!-- R4, R6, R7: Summary and budget -->
    <section class="card">
      <h2>Summary</h2>
      <div class="summary">
        <div>
          <span class="label">Total spent</span>
          <span id="total" class="value">$0.00</span>
        </div>
        <div>
          <span class="label">Spent this month</span>
          <span id="month-total" class="value">$0.00</span>
        </div>
        <div>
          <span class="label">Budget remaining</span>
          <span id="remaining" class="value">No budget set</span>
        </div>
      </div>

      <form id="budget-form" class="row">
        <label for="budget">Monthly budget</label>
        <input id="budget" type="number" min="0" step="0.01" placeholder="e.g. 500">
        <button type="submit">Set budget</button>
      </form>
      <p id="budget-error" class="error" role="alert"></p>
    </section>

    <!-- R1: Add an expense. R9-R13: the same form is used to edit an expense. -->
    <section class="card" id="expense-form-card">
      <h2 id="form-title">Add an expense</h2>
      <form id="expense-form" class="grid">
        <label>Name
          <input id="name" type="text" required>
        </label>
        <label>Amount
          <input id="amount" type="number" min="0.01" step="0.01" required>
        </label>
        <label>Category
          <select id="category" required></select>
        </label>
        <label>Date
          <input id="date" type="date" required>
        </label>
        <button type="submit">Add expense</button>
        <!-- Only shown while editing -->
        <button type="button" id="cancel-edit" class="secondary" hidden>Cancel</button>
      </form>
      <p id="expense-error" class="error" role="alert"></p>
    </section>

    <!-- R5: Spending by category -->
    <section class="card">
      <h2>Spending by category</h2>
      <ul id="category-list" class="plain-list"></ul>
    </section>

    <!-- R2, R3: Expense list -->
    <section class="card">
      <h2>Expenses</h2>

      <!-- R14-R16: Filters. They change only this list, not the totals. -->
      <div class="filters">
        <label>Category
          <select id="filter-category">
            <option value="">All categories</option>
          </select>
        </label>
        <label>Month
          <select id="filter-month">
            <option value="">All months</option>
          </select>
        </label>
        <button type="button" id="clear-filters" class="secondary">Clear filters</button>
      </div>

      <p id="empty-message">No expenses yet.</p>
      <div class="table-wrap">
      <table id="expense-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Name</th>
            <th>Category</th>
            <th class="number">Amount</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="expense-list"></tbody>
      </table>
      </div>
    </section>
  </main>

  <script src="expenses.js"></script>
  <script src="app.js"></script>
</body>
</html>
